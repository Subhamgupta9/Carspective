# ==============================================================================
# CARspective — NGINX Site Gateway Configuration
# Phase 21D: Reverse Proxy, Upstream Keep-Alive, Rate Limiting, TLS & Static Delivery
# ==============================================================================

upstream carspective_backend {
    server api:5001 max_fails=3 fail_timeout=10s;
    # Persistent upstream HTTP keepalive connection pool to eliminate socket queue stalls
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    root /usr/share/nginx/html;

    # TLS / SSL Termination Configuration (Requires explicitly mounted certificates; fails closed if missing)
    ssl_certificate /etc/nginx/certs/carspective.crt;
    ssl_certificate_key /etc/nginx/certs/carspective.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Global security response headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline';" always;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Standard proxy headers
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Use NGINX-generated request_id for end-to-end tracing across proxy and backend
    proxy_set_header X-Request-ID $request_id;

    # RFC 7807 Problem Details structured error handlers for gateway-level rejections
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/problem+json;
        return 429 '{"type":"https://carspective.internal/errors/rate_limit_exceeded","title":"Too Many Requests","status":429,"detail":"API rate limit exceeded. Please throttle requests and retry.","error_code":"RATE_LIMIT_EXCEEDED"}';
    }

    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/problem+json;
        return 413 '{"type":"https://carspective.internal/errors/payload_too_large","title":"Payload Too Large","status":413,"detail":"Request payload exceeds the maximum permitted limit of 5MB.","error_code":"PAYLOAD_TOO_LARGE"}';
    }

    # 1. Operational & Health Probes (Bypass all rate limiters)
    location ~ ^/(health|ready) {
        proxy_pass http://carspective_backend;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        access_log off;
    }

    # 2. Telemetry Metrics Endpoint
    location /metrics {
        proxy_pass http://carspective_backend;
    }

    # 3. Compute-Intensive Valuation and Comparison Endpoints (Strict Rate Limiting)
    location ~ ^/api/v1/(valuation|compare) {
        limit_req zone=api_valuation burst=10 nodelay;
        proxy_pass http://carspective_backend;
    }

    # 4. General API Endpoints
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://carspective_backend;
    }

    # 5. Static Assets (Compiled React / Vite distribution)
    # Offloaded completely from Python WSGI workers
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
        expires 1y;
        access_log off;
    }

    # 6. Single Page Application (SPA) HTML fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
