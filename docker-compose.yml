# ==============================================================================
# CARspective — Container Compose Configuration
# Provides local and standalone container evaluation with persistent volume
# and production environment variable bindings.
# ==============================================================================

services:
  carspective:
    build:
      context: .
      dockerfile: Dockerfile
    image: carspective:latest
    container_name: carspective-app
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - CARSPECTIVE_ENV=production
      - CARSPECTIVE_DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-generate_with_python_secrets_token_hex}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-generate_with_python_secrets_token_hex}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,carspective.local}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5001,http://127.0.0.1:5001}
      - DATABASE_URL=sqlite:////app/data/database/carspective.db
      - TRUSTED_PROXIES=0
    volumes:
      - carspective_data:/app/data/database
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health/liveness')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  carspective_data:
    driver: local
